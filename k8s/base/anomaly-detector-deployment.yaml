apiVersion: apps/v1
kind: Deployment
metadata:
  name: anomaly-detector
spec:
  replicas: 1
  selector:
    matchLabels:
      app: anomaly-detector
  template:
    metadata:
      labels:
        app: anomaly-detector
    spec:
      containers:
      - name: anomaly-detector
        image: anomaly-detector:v1
        imagePullPolicy: Never
        ports:
        - containerPort: 8002
        env:
        - name: PROMETHEUS_URL
          value: http://prometheus:9090
---
apiVersion: v1
kind: Service
metadata:
  name: anomaly-detector
spec:
  selector:
    app: anomaly-detector
  ports:
  - port: 8002
    targetPort: 8002
  type: NodePort