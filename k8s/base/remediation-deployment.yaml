apiVersion: apps/v1
kind: Deployment
metadata:
  name: remediation-engine
spec:
  replicas: 1
  selector:
    matchLabels:
      app: remediation-engine
  template:
    metadata:
      labels:
        app: remediation-engine
    spec:
      serviceAccountName: remediation-sa
      containers:
      - name: remediation-engine
        image: remediation-engine:v1
        imagePullPolicy: Never
        ports:
        - containerPort: 8004
        env:
        - name: ANOMALY_DETECTOR_URL
          value: http://anomaly-detector:8002
---
apiVersion: v1
kind: Service
metadata:
  name: remediation-engine
spec:
  selector:
    app: remediation-engine
  ports:
  - port: 8004
    targetPort: 8004
  type: NodePort